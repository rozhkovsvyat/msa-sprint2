# Версии (subsets), circuit breaking и пул «v1 с переходом на v2».
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: booking-service
  namespace: default
spec:
  host: booking-service
  trafficPolicy:
    # Circuit breaking: лимиты соединений и очереди. Сверх лимита Envoy сразу отвечает 503 (флаг UO),
    # а не копит ожидающие запросы, — перегрузка не расползается по цепочке вызовов.
    connectionPool:
      tcp:
        maxConnections: 10
        connectTimeout: 1s
      http:
        http1MaxPendingRequests: 5
        maxRequestsPerConnection: 20
    # Выбрасываем из балансировки под, который подряд отвечает 5xx; outlier detection нужен и для перехода на v2.
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 5s
      baseEjectionTime: 15s
      maxEjectionPercent: 100
    # Fallback v1 → v2: эндпоинты version=v1 получают приоритет P0, остальные (v2) — P1.
    # Пока у v1 есть здоровые поды, P1 не получает трафик этого маршрута; когда v1 недоступна
    # или выброшена outlier detection, трафик переходит на v2. Действует для маршрута без subset.
    loadBalancer:
      simple: ROUND_ROBIN
      localityLbSetting:
        enabled: true
        failoverPriority:
          - "version=v1"
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
