# Значения по умолчанию. Различия сред — в values-staging.yaml и values-prod.yaml.
replicaCount: 1

image:
  name: booking-service
  tag: ""            # задаётся пайплайном: короткий SHA коммита (неизменяемый тег, не latest)
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80           # http://booking-service/ping внутри кластера
  targetPort: 8080   # служебный HTTP сервиса: /ping, /ready, /version, /feature

grpc:
  containerPort: 9090  # gRPC для прокси монолита; в Service не публикуется на этом этапе

# Фича-флаг: при true сервис открывает /feature и сообщает featureX=true в /version
featureFlags:
  enableFeatureX: false

serviceVersion: v1

# Без BOOKING_DB и MONOLITH_URL сервис не стартует. В этом кластере нет PostgreSQL, Kafka и монолита:
# под отвечает на /ping, /version и /feature, /ready — 503, публикация событий выключена.
dependencies:
  bookingDb: "Host=booking-db;Database=booking;Username=booking;GSS Encryption Mode=Disable"
  monolithUrl: http://hotelio-monolith:8080/
  outboxPublisher: disabled

# Дополнительные переменные окружения контейнера
env: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Обе пробы — /ping. Когда у пода будет БД, readiness стоит перевести на /ready.
probes:
  path: /ping
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 2
    periodSeconds: 5
    failureThreshold: 3
