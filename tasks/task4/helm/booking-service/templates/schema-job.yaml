{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-schema
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      containers:
        - name: schema
          image: "{{ .Values.image.name }}:{{ required "image.tag обязателен" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          {{- if .Values.dependencies.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.dependencies.existingSecret }}
          {{- else }}
          env:
            - name: BOOKING_DB
              value: {{ .Values.dependencies.bookingDb | quote }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
