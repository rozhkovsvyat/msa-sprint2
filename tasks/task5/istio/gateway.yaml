# Вход в mesh. Проверочные скрипты обращаются к 127.0.0.1:19090:
#   kubectl -n istio-system port-forward svc/istio-ingressgateway 19090:80
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: booking-gateway
  namespace: default
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
