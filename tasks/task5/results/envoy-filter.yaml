# Фича-флаг на входном шлюзе: X-Feature-Enabled: true → внутренний заголовок маршрута x-booking-route: v2,
# по которому VirtualService отправляет запрос на v2. Присланный клиентом x-booking-route удаляется,
# поэтому попасть на v2 в обход флага нельзя. Нативная альтернатива — match.headers в VirtualService;
# EnvoyFilter требует проверки при каждом обновлении Istio (меняется внутренняя конфигурация Envoy).
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: booking-feature-flag
  namespace: istio-system
spec:
  workloadSelector:
    labels:
      istio: ingressgateway
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: booking.feature_flag.lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            default_source_code:
              inline_string: |
                function envoy_on_request(request_handle)
                  local headers = request_handle:headers()
                  headers:remove("x-booking-route")
                  local flag = headers:get("x-feature-enabled")
                  if flag ~= nil and string.lower(flag) == "true" then
                    headers:add("x-booking-route", "v2")
                  end
                  -- маршрут выбирается заново с учётом нового заголовка
                  request_handle:clearRouteCache()
                end
