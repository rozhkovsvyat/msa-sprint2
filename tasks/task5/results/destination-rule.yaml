# Версии (subsets), circuit breaking и пул «v1 с переходом на v2».
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: booking-service
  namespace: default
spec:
  host: booking-service
  trafficPolicy:
    # Circuit breaking: лимиты соединений и очереди. Сверх лимита Envoy сразу отвечает 503 (флаг UO).
    connectionPool:
      tcp:
        maxConnections: 10
        connectTimeout: 1s
      http:
        http1MaxPendingRequests: 5
        maxRequestsPerConnection: 20
    # Выбрасываем из балансировки под, который подряд отвечает 5xx; outlier detection нужен и для перехода на v2.
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 5s
      baseEjectionTime: 15s
      maxEjectionPercent: 100
    # Fallback v1 → v2: поды version=v1 получают приоритет P0, остальные (v2) — P1. Пока поды v1 здоровы,
    # трафик маршрута без subset идёт в v1; чем больше подов v1 недоступно или выброшено outlier detection,
    # тем больше трафика Envoy переводит на v2.
    loadBalancer:
      simple: ROUND_ROBIN
      localityLbSetting:
        enabled: true
        failoverPriority:
          - "version=v1"
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
