# Маршрутизация booking-service на входном шлюзе: фича-флаг, канарейка 90/10 с fallback и повторы.
# Через шлюз идут только служебные GET-запросы (/ping, /version, /feature), поэтому повтор при 5xx безопасен.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: booking-service
  namespace: default
spec:
  hosts:
    - "*"
  gateways:
    - booking-gateway
  http:
    # 1. Фича-флаг. Заголовок x-booking-route ставит только EnvoyFilter (envoy-filter.yaml)
    #    по X-Feature-Enabled: true; присланный клиентом x-booking-route фильтр удаляет.
    - name: feature-flag-v2
      match:
        - headers:
            x-booking-route:
              exact: v2
      route:
        - destination:
            host: booking-service
            subset: v2
      timeout: 10s
      retries:
        attempts: 2
        perTryTimeout: 4s
        retryOn: 5xx,connect-failure,reset,refused-stream
    # 2. Канарейка 90/10. 90% — общий пул без subset: по failoverPriority сначала v1, при отказе v1 — v2 (fallback).
    #    10% — сразу v2. Повторы задаются здесь, в DestinationRule их нет.
    - name: canary-with-fallback
      route:
        - destination:
            host: booking-service
          weight: 90
        - destination:
            host: booking-service
            subset: v2
          weight: 10
      timeout: 10s
      retries:
        attempts: 2
        perTryTimeout: 4s
        retryOn: 5xx,connect-failure,reset,refused-stream
